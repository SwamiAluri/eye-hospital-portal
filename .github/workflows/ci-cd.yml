name: Hospital Portal CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '18.x'
  AZURE_WEBAPP_NAME: hospital-portal-api
  AZURE_WEBAPP_PACKAGE_PATH: './microservices/auth-service/AuthService'

jobs:
  # Backend Build and Test
  backend-test:
    name: Backend - Build & Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore dependencies
      run: dotnet restore
      working-directory: ./microservices/auth-service/AuthService

    - name: Build backend
      run: dotnet build --configuration Release --no-restore
      working-directory: ./microservices/auth-service/AuthService

    - name: Run unit tests
      run: dotnet test --no-build --verbosity normal --configuration Release --collect:"XPlat Code Coverage"
      working-directory: ./AuthService.Tests

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ./AuthService.Tests/TestResults
        fail_ci_if_error: false

    - name: Publish backend
      run: dotnet publish --configuration Release --output ./publish
      working-directory: ./microservices/auth-service/AuthService

    - name: Upload backend artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-package
        path: ./microservices/auth-service/AuthService/publish

  # Frontend Build and Test
  frontend-test:
    name: Frontend - Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@v3
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Lint frontend
      run: pnpm run lint
      working-directory: ./apps/hospital-portal-web
      continue-on-error: true

    - name: Build frontend
      run: pnpm run build
      working-directory: ./apps/hospital-portal-web
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5073/api' }}

    - name: Run optometry parity tests (F0 / Program A / Program B gates)
      run: pnpm run test:unit:optometry
      working-directory: ./apps/hospital-portal-web

    - name: Upload frontend artifact
      uses: actions/upload-artifact@v3
      with:
        name: frontend-package
        path: ./apps/hospital-portal-web/.next

  # ── Laboratory Service (Enterprise LMS): Build & Test (L-CAT-01A) ───────────
  laboratory-build-test:
    name: LaboratoryApi — Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore LaboratoryApi
      run: dotnet restore
      working-directory: ./microservices/laboratory-service/LaboratoryApi

    - name: Build LaboratoryApi
      run: dotnet build --configuration Release --no-restore
      working-directory: ./microservices/laboratory-service/LaboratoryApi

    - name: Run LaboratoryApi.Tests
      run: |
        dotnet test ../LaboratoryApi.Tests/LaboratoryApi.Tests.csproj \
          --configuration Release \
          --verbosity normal \
          --collect:"XPlat Code Coverage" \
          --results-directory ./TestResults
      working-directory: ./microservices/laboratory-service/LaboratoryApi

    - name: Upload LaboratoryApi test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: laboratory-api-test-results
        path: ./microservices/laboratory-service/LaboratoryApi/TestResults
        if-no-files-found: ignore

  # ── CCMS Service: Build, Test & OpenAPI Contract Generation ─────────────────
  ccms-build-openapi:
    name: CCMS — Build, Test & Generate OpenAPI
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Restore CCMS dependencies
      run: dotnet restore
      working-directory: ./microservices/ccms-service/CcmsApi

    - name: Build CCMS service
      run: dotnet build --configuration Release --no-restore
      working-directory: ./microservices/ccms-service/CcmsApi

    - name: Run CCMS unit + integration tests
      run: |
        if [ -d "../CcmsApi.Tests" ]; then
          dotnet test ../CcmsApi.Tests/CcmsApi.Tests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --collect:"XPlat Code Coverage" \
            --results-directory ./TestResults
        else
          echo "No test project found — skipping (tests not yet created)"
        fi
      working-directory: ./microservices/ccms-service/CcmsApi

    - name: Upload CCMS test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ccms-test-results
        path: ./microservices/ccms-service/CcmsApi/TestResults
        if-no-files-found: ignore

    - name: Generate OpenAPI contract (swagger.json)
      run: |
        # Start the functions host, wait for it to be ready, then fetch the spec.
        # Uses the static swagger export endpoint provided by the OpenApi extension.
        dotnet publish --configuration Release --output ./publish --no-build \
          -p:CopyOutputSymbolsToPublishDirectory=false
        # Run host in background with a dummy connection string (spec generation is metadata-only)
        ASPNETCORE_URLS="http://localhost:7272" \
        AzureWebJobsStorage="UseDevelopmentStorage=true" \
        ConnectionStrings__DefaultConnection="Host=localhost;Database=ccms_test;Username=test;Password=test" \
        func start --port 7272 &
        HOST_PID=$!
        # Poll until /api/swagger.json responds (max 30s)
        for i in $(seq 1 30); do
          sleep 1
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7272/api/swagger.json || true)
          if [ "$STATUS" = "200" ]; then
            echo "OpenAPI endpoint ready after ${i}s"
            break
          fi
        done
        curl -s http://localhost:7272/api/swagger.json -o ./ccms-openapi.json
        curl -s http://localhost:7272/api/swagger.yaml -o ./ccms-openapi.yaml
        kill $HOST_PID 2>/dev/null || true
        echo "✅ OpenAPI spec generated ($(wc -c < ./ccms-openapi.json) bytes)"
      working-directory: ./microservices/ccms-service/CcmsApi
      continue-on-error: true   # non-blocking: spec is an artifact, not a build gate

    - name: Upload OpenAPI spec artifact
      uses: actions/upload-artifact@v4
      with:
        name: ccms-openapi-spec
        path: |
          ./microservices/ccms-service/CcmsApi/ccms-openapi.json
          ./microservices/ccms-service/CcmsApi/ccms-openapi.yaml
        if-no-files-found: ignore

    - name: Commit spec to docs/ (on main only)
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        mkdir -p docs/api
        cp ./microservices/ccms-service/CcmsApi/ccms-openapi.json docs/api/ccms-openapi.json || true
        cp ./microservices/ccms-service/CcmsApi/ccms-openapi.yaml docs/api/ccms-openapi.yaml || true
        git config user.name  "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add docs/api/ccms-openapi.json docs/api/ccms-openapi.yaml || true
        git diff --cached --quiet || git commit -m "ci: update CCMS OpenAPI spec [skip ci]"
        git push || true
      continue-on-error: true

  # ── Frontend: E2E Smoke Tests (Playwright) ──────────────────────────────────
  e2e-tests:
    name: Frontend — Playwright E2E Smoke Tests
    runs-on: ubuntu-latest
    # Only run on PRs and main pushes (not on feature branch pushes to keep CI fast)
    if: |
      github.event_name == 'pull_request' ||
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Install frontend dependencies
      run: pnpm install --frozen-lockfile
      working-directory: ./apps/hospital-portal-web

    - name: Install Playwright browsers
      run: pnpm exec playwright install --with-deps chromium
      working-directory: ./apps/hospital-portal-web

    - name: Build Next.js app for E2E
      run: pnpm run build
      working-directory: ./apps/hospital-portal-web
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:5073/api' }}
        NEXTAUTH_SECRET: 'playwright-ci-secret'
        NEXTAUTH_URL: 'http://localhost:3000'

    - name: Resolve optometry E2E fixtures (Program A)
      run: |
        npx tsx scripts/resolve-e2e-optometry-fixtures.ts --github-env >> "$GITHUB_ENV" || true
      working-directory: ./apps/hospital-portal-web
      env:
        API_URL: ${{ secrets.E2E_API_URL || 'http://localhost:5073' }}

    - name: Run Playwright E2E tests (Chromium only on CI)
      run: pnpm exec playwright test --project=chromium --reporter=github
      working-directory: ./apps/hospital-portal-web
      env:
        PLAYWRIGHT_BASE_URL: ${{ secrets.E2E_FRONTEND_URL || '' }}
        E2E_API_URL: ${{ secrets.E2E_API_URL || '' }}
        E2E_TEST_EMAIL: ${{ secrets.E2E_TEST_EMAIL || 'admin@test.com' }}
        E2E_TEST_PASSWORD: ${{ secrets.E2E_TEST_PASSWORD || 'Admin123!' }}
        E2E_TEST_TENANT_ID: ${{ secrets.E2E_TEST_TENANT_ID || '155fe198-6ae5-4a01-9254-ead5b427247e' }}
        E2E_OPTOMETRY_PATIENT_ID: ${{ env.E2E_OPTOMETRY_PATIENT_ID }}
        E2E_OPTOMETRY_VISIT_ID: ${{ env.E2E_OPTOMETRY_VISIT_ID }}
        CI: 'true'
      continue-on-error: true   # E2E failures are surfaced as warnings, not blockers, until seed data is stable

    - name: Upload Playwright report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: ./apps/hospital-portal-web/e2e/playwright-report
        retention-days: 14
        if-no-files-found: ignore

    - name: Upload Playwright test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: ./apps/hospital-portal-web/e2e/.test-results
        retention-days: 7
        if-no-files-found: ignore

  # Database Validation
  database-validation:
    name: Database - Validate Migrations
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Validate numbered SQL migrations exist
      run: |
        echo "Numbered files in consolidated/migrations:"
        ls -1 ./consolidated/migrations/[0-9]*.sql | sort -V
        test -f ./consolidated/migrations/164_outbox_versioned_schema.sql
        test -f ./consolidated/migrations/165_bed_inventory_ward_id_and_daycare_types.sql
        test -f ./consolidated/migrations/166_journey_slot.sql
        echo "164 outbox versioned schema is present"
        echo "165 bed inventory ward_id / day-care types is present"
        echo "166 journey_slot is present"

    - name: Schema drift (DB-005) — IP EF vs SQL + no runtime outbox DDL
      run: |
        dotnet test ./microservices/ip-management-service/IpManagementService.Tests/IpManagementService.Tests.csproj \
          --filter FullyQualifiedName~SchemaDrift \
          -p:UseAppHost=false \
          --verbosity normal
        dotnet test ./AuthService.Tests/AuthService.Tests.csproj \
          --filter FullyQualifiedName~SchemaDrift \
          -p:UseAppHost=false \
          --verbosity normal

  # Deploy to Azure (only on main branch)
  deploy-backend:
    name: Deploy Backend to Azure
    needs: [backend-test, ccms-build-openapi, laboratory-build-test, frontend-test, database-validation]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download backend artifact
      uses: actions/download-artifact@v3
      with:
        name: backend-package
        path: ./backend-package

    - name: Login to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_NAME }}
        package: ./backend-package

    - name: Logout from Azure
      run: az logout

  # Deploy Frontend to Azure Static Web Apps (or Vercel)
  deploy-frontend:
    name: Deploy Frontend
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ env.NODE_VERSION }}

    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Build frontend
      run: pnpm run build
      working-directory: ./apps/hospital-portal-web
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: "upload"
        app_location: "./apps/hospital-portal-web"
        output_location: ".next"

  # Run Database Migrations (only on main branch)
  run-migrations:
    name: Run Database Migrations
    needs: deploy-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install EF Core tools
      run: dotnet tool install --global dotnet-ef

    - name: Run EF Core migrations
      run: dotnet ef database update --project ./microservices/auth-service/AuthService
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}

    - name: Run custom SQL migrations
      run: |
        # Install PostgreSQL client
        sudo apt-get update
        sudo apt-get install -y postgresql-client
        
        # Run migration scripts
        for file in ./migrations/*.sql; do
          if [ -f "$file" ]; then
            echo "Running migration: $file"
            psql "${{ secrets.DATABASE_CONNECTION_STRING }}" -f "$file"
          fi
        done

  # Smoke Tests (Post-Deployment)
  smoke-tests:
    name: Smoke Tests
    needs: [deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - name: Health Check - Backend API
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/health)
        if [ $response -ne 200 ]; then
          echo "Backend health check failed with status: $response"
          exit 1
        fi
        echo "Backend health check passed"

    - name: Health Check - Frontend
      run: |
        response=$(curl -s -o /dev/null -w "%{http_code}" ${{ secrets.FRONTEND_URL }})
        if [ $response -ne 200 ]; then
          echo "Frontend health check failed with status: $response"
          exit 1
        fi
        echo "Frontend health check passed"

    - name: Test Authentication Endpoint
      run: |
        # Test login endpoint is accessible
        response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
          https://${{ env.AZURE_WEBAPP_NAME }}.azurewebsites.net/api/auth/login \
          -H "Content-Type: application/json")
        
        # Expecting 400 (bad request) for empty body, not 500 or 404
        if [ $response -eq 404 ] || [ $response -eq 500 ]; then
          echo "Auth endpoint check failed with status: $response"
          exit 1
        fi
        echo "Auth endpoint is accessible"

  # Notification on Failure
  notify-failure:
    name: Notify on Failure
    needs: [backend-test, ccms-build-openapi, laboratory-build-test, frontend-test, e2e-tests, deploy-backend, deploy-frontend]
    runs-on: ubuntu-latest
    if: failure()

    steps:
    - name: Send failure notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        text: 'Hospital Portal deployment failed!'
        webhook_url: ${{ secrets.SLACK_WEBHOOK }}
      if: always()
